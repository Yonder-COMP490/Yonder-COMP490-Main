spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Yonder}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
##this is the fall-back database credentials if the .env file is not found. This is for a local postgres Database.  

## Note The .env file is used to store sensitive information like database credentials and should not be committed to version control.